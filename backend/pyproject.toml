[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-radar-backend"
version = "0.1.0"
description = "Backend for parking-radar"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22,<1.0",
  "alembic>=1.19,<2.0",
  "asyncpg>=0.31,<1.0",
  "fastapi>=0.141,<1.0",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.32,<1.0",
  "pydantic-settings>=2.15,<3.0",
  "sqlalchemy>=2.0.52,<3.0",
  "uvicorn[standard]>=0.52,<1.0",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.14,<5.0",
  "pytest>=9.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=7.1,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
